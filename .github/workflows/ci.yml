# Her push ve PR'da tipler, Biome ve birim testleri. Derleme Vercel'de; e2e gerçek Supabase'e
# yazdığı için burada değil, lokalde çalıştırılır (README → Test).
name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4 # sürüm package.json'daki packageManager'dan
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm test
